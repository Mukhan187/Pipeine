name: "Terraform Dynamic Azure Pipeline"

on:
  push:
    branches:
      - main
      - master
    paths:
      - "environments/**"
      - "modules/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "environments/**"
      - "modules/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod
      action:
        description: "Terraform Action"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID || 'c14887df-3ce2-44d2-adb8-4405e7e105d8' }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || '4a2b17d6-1fca-4667-b104-d0ccd5c3a172' }}
  TF_STATE_RG: ${{ secrets.TF_STATE_RESOURCE_GROUP || 'rg-terraform-tfstate' }}
  TF_STATE_STORAGE: ${{ secrets.TF_STATE_STORAGE_ACCOUNT }}
  TF_STATE_CONTAINER: ${{ secrets.TF_STATE_CONTAINER || 'tfstate' }}
  TF_VERSION: "1.7.5"
  TARGET_ENV: ${{ github.event.inputs.environment || 'dev' }}

jobs:
  # ===========================================================================
  # 1. LINT & SYNTAX VALIDATION (No Azure credentials needed)
  # ===========================================================================
  validate:
    name: "Lint & Validate Code"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Validate Dev Environment
        working-directory: environments/dev
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate Prod Environment
        working-directory: environments/prod
        run: |
          terraform init -backend=false
          terraform validate

  # ===========================================================================
  # 2. TERRAFORM PLAN (Dynamic Backend Injection)
  # ===========================================================================
  plan:
    name: "Terraform Plan (${{ github.event.inputs.environment || 'dev' }})"
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Initialize Terraform with Dynamic Backend
        working-directory: environments/${{ env.TARGET_ENV }}
        run: |
          if [ -n "${{ env.TF_STATE_STORAGE }}" ] && [ -n "${{ env.ARM_CLIENT_ID }}" ]; then
            echo "Initializing with Remote Azure Backend..."
            terraform init \
              -backend-config="resource_group_name=${{ env.TF_STATE_RG }}" \
              -backend-config="storage_account_name=${{ env.TF_STATE_STORAGE }}" \
              -backend-config="container_name=${{ env.TF_STATE_CONTAINER }}" \
              -backend-config="key=${{ env.TARGET_ENV }}.terraform.tfstate"
          else
            echo "Running in Local State Validation mode..."
            terraform init -backend=false
          fi

      - name: Terraform Plan
        id: plan
        working-directory: environments/${{ env.TARGET_ENV }}
        run: |
          if [ -n "${{ env.ARM_CLIENT_ID }}" ]; then
            terraform plan -no-color -out=tfplan
          else
            echo "::warning ::Azure Credentials (AZURE_CLIENT_ID) not configured in GitHub Secrets. Skipping remote plan execution."
          fi
        continue-on-error: false

      - name: Upload Plan Artifact
        if: env.ARM_CLIENT_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.TARGET_ENV }}
          path: environments/${{ env.TARGET_ENV }}/tfplan

  # ===========================================================================
  # 3. TERRAFORM APPLY (Automated on Main Merge or Manual Dispatch)
  # ===========================================================================
  apply:
    name: "Terraform Apply (${{ github.event.inputs.environment || 'dev' }})"
    needs: [plan]
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Apply Infrastructure
        working-directory: environments/${{ env.TARGET_ENV }}
        run: |
          if [ -n "${{ env.TF_STATE_STORAGE }}" ] && [ -n "${{ env.ARM_CLIENT_ID }}" ]; then
            terraform init \
              -backend-config="resource_group_name=${{ env.TF_STATE_RG }}" \
              -backend-config="storage_account_name=${{ env.TF_STATE_STORAGE }}" \
              -backend-config="container_name=${{ env.TF_STATE_CONTAINER }}" \
              -backend-config="key=${{ env.TARGET_ENV }}.terraform.tfstate"
            terraform apply -auto-approve
          else
            echo "::warning ::Azure Credentials or Storage Account not set in Secrets. Skipping live apply."
          fi
